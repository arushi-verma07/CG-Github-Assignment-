<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku and Answer Boards</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 900px;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #111;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, minmax(30px, 45px));
            grid-template-rows: repeat(9, minmax(30px, 45px));
            border: 3px solid #000;
            background-color: #000;
            gap: 1px;

            
        }

        .cell {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: normal;
            color: #111;
        }


        .c4r1,
        .c5r1,
        .c6r1,
        .c4r2,
        .c5r2,
        .c6r2,
        .c4r3,
        .c5r3,
        .c6r3,

        .c1r4,
        .c2r4,
        .c3r4,
        .c1r5,
        .c2r5,
        .c3r5,
        .c1r6,
        .c2r6,
        .c3r6,
      
        .c7r4,
        .c8r4,
        .c9r4,
        .c7r5,
        .c8r5,
        .c9r5,
        .c7r6,
        .c8r6,
        .c9r6,
      
        .c4r7,
        .c5r7,
        .c6r7,
        .c4r8,
        .c5r8,
        .c6r8,
        .c4r9,
        .c5r9,
        .c6r9 {
            background-color: #b7dfb9;
           
        }

    
        @media (max-width: 600px) {
            .sudoku-grid {
                grid-template-columns: repeat(9, 32px);
                grid-template-rows: repeat(9, 32px);
            }

            .cell {
                font-size: 15px;
            }

            .wrapper {
                gap: 25px;
            }
        }
    </style>
</head>

<body>
