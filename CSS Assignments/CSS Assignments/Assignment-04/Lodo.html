<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
        

        }

        .lodo {
            height: 700px;
            width: 700px;
        


        }
        
        .upper,
        .middel,
        .bottom{
            display: flex;
            width:100%;
        }
        
        .upper, .bottom{
            height: 275px;
        }

        .middel{
            height:150px;
        }

        .red {
        
            border: 40px solid red;
            height: 100%;
            width: 275px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content:center;

        }

        .free{
            width:50%;
            height:50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cir{
            height: 50%;
            width: 50%;
            border: 5px solid red;
            border-radius: 50%;
        }

        .red-mid {
            height:275px;
            width: 150px;
            display: flex;
            flex-wrap:wrap;
            justify-content: center;
            align-items: center;

        }

        .bgmi{
            border: 1.5px solid black;
            height:46px;
            width: 50px;
        
        }

        .green {
            border: 40px solid green;
            height: 100%;
            width: 275px;
            display: flex;
            flex-wrap:wrap;
            align-items: center;
            justify-content: center;
        }

        .vree{
            height:50%;
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cle{
            width: 50%;
            height:50%;
            border:5px solid green;
            border-radius: 50%;

        }

        .three {
            display: inline-block;
            box-sizing: border-box;
        }

        .blue {
            border: 40px solid blue;
            height: 100%;
            width: 275px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

        }

        
        .shree{
            width:50%;
            height:50%;
            /* border: 2px solid blue; */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .sir{
            width: 50%;
            height: 50%;
            border: 5px solid blue;
            border-radius: 50%;

        }
        .blue-mid {
            /* background-color: #dbeaf4; */
            height:100%;
            width: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;

        }
        .bgmi2{
            height:46px;
            width:50px;
            border: 1.5px solid black; 
        }

        .yellow {
            border: 40px solid yellow;
            height: 275px;
            width: 275px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .gree{
            width:50%;
            height:50%;
            /* border:2px solid blue; */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vir{
            width: 50%;
            height:50%;
            border:5px solid yellow;
            border-radius:50%;
        }
        
        .left{
            /* border:1.5px solid black; */
            width:275px;
            height:150px
        }
        .midd{
            border:2px solid rgb(10, 0, 2);
            height:150px;
            width:150px;
        }


        .left{
            /* border:2px solid black; */
            width:275px;
            height:150px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .bgmi3{
            height:51px;
            width:45px;
            border: 1.5px solid black;
        }
         
         .right{
            /* border:2px solid black; */
            width:275px;
            height:150px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .bgmi4{
            height:50px;
            width:45px;
            border: 1.5px solid black;
        }

        .left, .right{
            width:275px;
            height:100%;
        }

    </style>
</head>

                <div class="shree"> <div class="sir"> </div> </div>
